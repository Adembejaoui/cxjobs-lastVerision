name: k6 Load Testing

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      target-url:
        description: 'Target URL for load testing (staging/production)'
        required: false
        default: 'https://cxjobs-staging.vercel.app'
     vus:
        description: 'Target VUs for load test'
        required: false
        default: '50'

jobs:
  k6-load-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run k6 load test
        uses: grafana/k6-action@v0.2.0
        with:
          filename: tests/k6/production-authenticated-candidate.js
        env:
          K6_BASE_URL: ${{ github.event.inputs.target-url || 'https://cxjobs-staging.vercel.app' }}
          K6_TARGET_VUS: ${{ github.event.inputs.vus || '50' }}
          K6_SESSION_COOKIE: ${{ secrets.K6_SESSION_COOKIE }}
          K6_SESSION_COOKIE_NAME: ${{ secrets.K6_SESSION_COOKIE_NAME }}

      - name: Upload k6 results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-results
          path: output/
          retention-days: 7