name: Performance CI

# Lighthouse against a LOCAL production build. Safety:
#  - No production (or any service) secrets: every service variable is an
#    unroutable placeholder (127.0.0.1:9), so the build and the local server
#    can never reach a real database, Redis, storage bucket, email provider or
#    OAuth app. The build performs no database access by design.
#  - Only pages that render without a database or a session are audited
#    (see lighthouserc.json); data-backed pages need a staging environment.
#  - Reports are kept as a workflow artifact (filesystem upload), never
#    published to public storage.
#  - Nothing is deployed and no external URL is load-tested.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: perf-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"
  DATABASE_URL: postgresql://placeholder:placeholder@127.0.0.1:9/placeholder
  DIRECT_DATABASE_URL: postgresql://placeholder:placeholder@127.0.0.1:9/placeholder
  AUTH_SECRET: ci-placeholder-secret-not-real-0123456789
  NEXTAUTH_URL: http://localhost:3000
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  GOOGLE_CLIENT_ID: placeholder
  GOOGLE_CLIENT_SECRET: placeholder
  # Format-valid all-zero key (base64 of 32 bytes); required at module load.
  INVITATION_TOKEN_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
  UPSTASH_REDIS_REST_URL: http://127.0.0.1:9
  UPSTASH_REDIS_REST_TOKEN: placeholder
  NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:9
  SUPABASE_SERVICE_ROLE_KEY: placeholder
  EMAIL_PROVIDER: disabled

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      # postinstall runs `prisma generate` (offline; needs no database URL).
      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      # Lighthouse CI starts the server itself (startServerCommand in
      # lighthouserc.json) with the placeholder env above, waits for "Ready",
      # audits, and stops it. No separate `npm run start` step: that used to
      # start a second server on the same port, without any env.
      - name: Run Lighthouse CI
        run: npx lhci autorun

      - name: Upload Lighthouse results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-results
          path: .lighthouseci/
          retention-days: 7
